<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="compassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="20" fill="url(#compassGradient)"/>

  <!-- Center circle -->
  <circle cx="50" cy="50" r="35" fill="white" opacity="0.95"/>

  <!-- Compass Rose - 4 pointed design -->
  <!-- North point (primary color - teal) -->
  <path d="M 50 15 L 55 35 L 50 40 L 45 35 Z" fill="#14b8a6"/>

  <!-- South point -->
  <path d="M 50 85 L 55 65 L 50 60 L 45 65 Z" fill="#64748b" opacity="0.4"/>

  <!-- East point -->
  <path d="M 85 50 L 65 55 L 60 50 L 65 45 Z" fill="#64748b" opacity="0.4"/>

  <!-- West point -->
  <path d="M 15 50 L 35 55 L 40 50 L 35 45 Z" fill="#64748b" opacity="0.4"/>

  <!-- Diagonal lines for secondary points (lighter) -->
  <line x1="50" y1="50" x2="65" y2="35" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="50" x2="65" y2="65" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="50" x2="35" y2="65" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="50" x2="35" y2="35" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#2563eb"/>
</svg>