<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#2563eb"/>

  <!-- Money symbol outline -->
  <g fill="white">
    <!-- Dollar sign -->
    <text x="50" y="65" font-size="70" text-anchor="middle" dominant-baseline="middle" font-weight="bold">$</text>
  </g>

  <!-- Accent dots -->
  <circle cx="20" cy="20" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="80" cy="80" r="4" fill="#60a5fa" opacity="0.8"/>
</svg>